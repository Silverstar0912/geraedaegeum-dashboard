<title>거래대금 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#f2f4f5; --panel:#fbfcfc; --panel-2:#f7f9f9;
  --ink:#11161b; --ink-2:#4b5661; --ink-3:#7d8892;
  --rule:#dde2e5; --rule-soft:#e9edef; --grid:#e4e8ea;
  --accent:#2a78d6; --accent-2:#eb6834; --accent-3:#1baf7a; --accent-4:#4a3aa7;
  --up:#cf3a3a; --down:#2a6fd0;
  --shadow:0 1px 2px rgba(18,24,30,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0e1216; --panel:#161c22; --panel-2:#1b222a;
    --ink:#eef2f5; --ink-2:#a4afba; --ink-3:#6e7a86;
    --rule:#262e37; --rule-soft:#1d242c; --grid:#232b34;
    --accent:#3987e5; --accent-2:#d95926; --accent-3:#199e70; --accent-4:#9085e9;
    --up:#e66767; --down:#4f92e8;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0e1216; --panel:#161c22; --panel-2:#1b222a;
  --ink:#eef2f5; --ink-2:#a4afba; --ink-3:#6e7a86;
  --rule:#262e37; --rule-soft:#1d242c; --grid:#232b34;
  --accent:#3987e5; --accent-2:#d95926; --accent-3:#199e70; --accent-4:#9085e9;
  --up:#e66767; --down:#4f92e8;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:28px 16px 64px}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}

/* ── 머리말 ─────────────────────────────── */
header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
  padding-bottom:18px; border-bottom:1px solid var(--rule)}
h1{margin:0; font-size:21px; font-weight:600; letter-spacing:-.01em}
.eyebrow{margin:0 0 3px; font-size:10.5px; font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3)}
.asof{margin-left:auto; text-align:right; font-size:12px; color:var(--ink-2)}
.asof b{display:block; font-size:15px; font-weight:600; color:var(--ink)}

/* ── 헤드라인 수치 ──────────────────────── */
.heads{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));
  gap:1px; background:var(--rule-soft); border:1px solid var(--rule-soft);
  margin:22px 0 0; border-radius:10px; overflow:hidden}
.head{background:var(--panel); padding:15px 16px 14px}
.head .k{font-size:11.5px; color:var(--ink-3); letter-spacing:.02em}
.head .v{margin-top:5px; font-size:25px; font-weight:600; letter-spacing:-.02em}
.head .u{font-size:12px; font-weight:400; color:var(--ink-3); margin-left:3px}
.head .s{margin-top:3px; font-size:12px; color:var(--ink-2)}
.up{color:var(--up)} .down{color:var(--down)}

/* ── 툴바 ──────────────────────────────── */
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:26px 0 4px}
.bar .lbl{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.seg{display:flex; gap:1px; background:var(--rule-soft); padding:1px;
  border-radius:7px; margin-left:auto}
.seg button{appearance:none; border:0; background:var(--panel); color:var(--ink-2);
  font:inherit; font-size:12.5px; padding:5px 13px; cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--ground); font-weight:500}
.seg button:focus-visible{outline:2px solid var(--accent); outline-offset:1px; z-index:1}

/* ── 차트 ──────────────────────────────── */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr)); gap:14px; margin-top:14px}
.card{background:var(--panel); border:1px solid var(--rule-soft); border-radius:10px;
  padding:15px 16px 8px; box-shadow:var(--shadow); min-width:0}
.card.wide{grid-column:1/-1}
.card h2{margin:0; font-size:13.5px; font-weight:600; letter-spacing:-.005em}
.card .sub{margin:2px 0 0; font-size:11.5px; color:var(--ink-3)}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; margin:9px 0 2px}
.legend span{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2)}
.legend i{width:11px; height:3px; border-radius:2px; display:inline-block}
figure{margin:0; position:relative}
svg{display:block; width:100%; height:auto; overflow:visible}
.tip{position:absolute; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--panel-2); border:1px solid var(--rule); border-radius:7px;
  padding:8px 10px; font-size:11.5px; box-shadow:0 4px 14px rgba(10,15,20,.14);
  white-space:nowrap; z-index:5}
.tip .td{font-size:10.5px; color:var(--ink-3); letter-spacing:.04em; margin-bottom:4px}
.tip .tr{display:flex; align-items:center; gap:7px; margin-top:2px}
.tip .tr i{width:8px; height:8px; border-radius:2px; flex:none}
.tip .tr b{margin-left:auto; font-weight:500}
.empty{padding:34px 4px 30px; font-size:12px; color:var(--ink-3)}

/* ── 수급 섹션 ─────────────────────────── */
#flows{margin-top:34px; border-top:1px solid var(--rule); padding-top:6px}
.secttl{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em}
.note{margin:8px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.6}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.rank{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px}
.rank td{padding:5px 0; border-bottom:1px solid var(--rule-soft); text-align:right;
  white-space:nowrap}
.rank td:first-child{text-align:left; white-space:normal; padding-right:8px}
.rank tr:last-child td{border-bottom:0}
.rank .mk{font-size:10px; color:var(--ink-3); margin-left:5px; letter-spacing:.03em}
.rank .amt{font-weight:500}
.rank .bar-cell{width:88px; padding-left:10px}
.rank .track{display:block; height:6px; border-radius:3px; background:var(--rule-soft)}
.rank .fill{display:block; height:6px; border-radius:3px}

/* ── 표 ────────────────────────────────── */
details{margin-top:22px; border-top:1px solid var(--rule); padding-top:14px}
summary{cursor:pointer; font-size:12.5px; color:var(--ink-2); width:max-content}
summary:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.scroll{overflow-x:auto; margin-top:12px; border:1px solid var(--rule-soft); border-radius:8px}
table{border-collapse:collapse; width:100%; font-size:12px}
th,td{padding:6px 11px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--rule-soft)}
th{position:sticky; top:0; background:var(--panel-2); color:var(--ink-3);
  font-weight:500; font-size:11px; text-align:right}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}

footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--rule);
  font-size:11.5px; color:var(--ink-3); line-height:1.75}
footer b{color:var(--ink-2); font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

/* ── 포맷 ─────────────────────────────── */
const nf = (v, d = 0) => v == null ? '—' :
  v.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
const jo = v => v == null ? '—' : (v / 1e6).toFixed(1);          // 백만원 → 조원
const eok = v => v == null ? '—' : nf(v / 100, 0);               // 백만원 → 억원
const pct = (v, d = 2) => v == null ? '—' : (v * 100).toFixed(d) + '%';
const md = s => s.slice(5).replace('-', '/');

/* ── 축 눈금 ──────────────────────────── */
function ticks(lo, hi, n = 4) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || mag * 10;
  const out = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-9; t += step) out.push(t);
  return out;
}

/* ── 선/영역 차트 ─────────────────────── */
const W = 720, H = 210, PAD = { t: 12, r: 14, b: 24, l: 58 };

function chart(host, cfg) {
  const rows = cfg.rows;
  const series = cfg.series.filter(s => rows.some(r => s.get(r) != null));
  if (!series.length) {
    host.innerHTML = '<p class="empty">이 지표는 아직 채워진 데이터가 없습니다.</p>';
    return;
  }
  const vals = [];
  rows.forEach(r => series.forEach(s => { const v = s.get(r); if (v != null) vals.push(v); }));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (cfg.zero) lo = Math.min(0, lo);
  if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const tk = ticks(lo, hi, 4);
  lo = Math.min(lo, tk[0]); hi = Math.max(hi, tk[tk.length - 1]);

  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b;
  const X = i => PAD.l + (rows.length < 2 ? iw / 2 : i * iw / (rows.length - 1));
  const Y = v => PAD.t + ih - (v - lo) / (hi - lo) * ih;

  let g = '';
  tk.forEach(t => {
    g += `<line x1="${PAD.l}" y1="${Y(t).toFixed(1)}" x2="${W - PAD.r}" y2="${Y(t).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${PAD.l - 8}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)" class="num">${cfg.tick(t)}</text>`;
  });

  const nlab = Math.min(6, rows.length);
  for (let k = 0; k < nlab; k++) {
    const i = Math.round(k * (rows.length - 1) / Math.max(1, nlab - 1));
    g += `<text x="${X(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" class="num">${md(rows[i].d)}</text>`;
  }

  series.forEach(s => {
    const pts = [];
    rows.forEach((r, i) => { const v = s.get(r); if (v != null) pts.push([X(i), Y(v), i]); });
    if (!pts.length) return;
    const dd = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (cfg.area && series.length === 1) {
      g += `<path d="${dd} L${pts[pts.length - 1][0].toFixed(1)} ${Y(Math.max(lo, 0)).toFixed(1)} L${pts[0][0].toFixed(1)} ${Y(Math.max(lo, 0)).toFixed(1)} Z" fill="${s.color}" fill-opacity=".10" stroke="none"/>`;
    }
    g += `<path d="${dd}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const e = pts[pts.length - 1];
    g += `<circle cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
  });

  g += `<line id="cross" x1="0" y1="${PAD.t}" x2="0" y2="${PAD.t + ih}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  g += `<rect x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>`;

  host.innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${cfg.title}">${g}</svg><div class="tip"></div>`;

  /* 호버 레이어 */
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'),
    cross = svg.querySelector('#cross'), hit = svg.querySelector('#hit');
  const move = ev => {
    const b = svg.getBoundingClientRect();
    const px = (ev.clientX - b.left) / b.width * W;
    let i = Math.round((px - PAD.l) / (iw || 1) * (rows.length - 1));
    i = Math.max(0, Math.min(rows.length - 1, i));
    const r = rows[i];
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
    cross.setAttribute('opacity', '.35');
    tip.innerHTML = `<div class="td num">${r.d}</div>` + series.map(s =>
      `<div class="tr"><i style="background:${s.color}"></i>${s.name}<b class="num">${s.fmt(s.get(r))}</b></div>`).join('');
    tip.style.opacity = 1;
    const left = X(i) / W * b.width;
    tip.style.left = Math.max(4, Math.min(b.width - tip.offsetWidth - 4, left + 12)) + 'px';
    tip.style.top = '6px';
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  host.addEventListener('pointerleave', () => {
    tip.style.opacity = 0; cross.setAttribute('opacity', 0);
  });
}

const F = DATA.flows;
let WHO = 'frgn', WIN = 'day';

function cumulate(series, keys, n) {
  const rows = n ? series.slice(-n) : series;
  const acc = {}; keys.forEach(k => acc[k] = 0);
  return rows.map(r => {
    const o = { d: r.d };
    keys.forEach(k => { acc[k] += (r[k] || 0); o[k] = acc[k]; });
    return o;
  });
}

/* 가로 막대 — 매수/매도 부호가 있으니 두 색으로 나눈다 */
function bars(host, items, fmt) {
  if (!items.length) { host.innerHTML = '<p class="empty">데이터 없음</p>'; return; }
  const up = C('--up'), down = C('--down');
  const max = Math.max(...items.map(i => Math.abs(i.v))) || 1;
  const w = 720, rowH = 26, padL = 92, padR = 74, h = items.length * rowH + 8;
  const zero = padL + (w - padL - padR) / 2, half = (w - padL - padR) / 2;
  let g = `<line x1="${zero}" y1="4" x2="${zero}" y2="${h - 4}" stroke="var(--grid)" stroke-width="1"/>`;
  items.forEach((it, i) => {
    const y = i * rowH + 8, bw = Math.abs(it.v) / max * half * 0.94;
    const pos = it.v >= 0;
    const x = pos ? zero : zero - bw;
    g += `<text x="${padL - 10}" y="${y + 11}" text-anchor="end" font-size="11.5" fill="var(--ink-2)">${it.k}</text>`;
    g += `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(bw, 1).toFixed(1)}" height="14" rx="4"
            fill="${pos ? up : down}"/>`;
    g += `<rect x="${(pos ? zero : zero - 2).toFixed(1)}" y="${y}" width="2" height="14" fill="${pos ? up : down}"/>`;
    g += `<text x="${(pos ? zero + bw + 8 : zero - bw - 8).toFixed(1)}" y="${y + 11}"
            text-anchor="${pos ? 'start' : 'end'}" font-size="11.5" fill="var(--ink-2)" class="num">${fmt(it.v)}</text>`;
  });
  host.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="주체별 순매수">${g}</svg>`;
}

function flowCharts(n) {
  const A = C('--accent'), B = C('--accent-2'), G = C('--accent-3');
  const keys = ['individual', 'frgn', 'inst'];
  const named = [['individual', '개인', G], ['frgn', '외국인', A], ['inst', '기관계', B]];
  const grid = document.getElementById('flowgrid');

  const specs = [
    { id: 'cumKOSPI', title: '코스피 누적 순매수', sub: '표시 기간 시작일 기준 누계 · 억원', market: 'KOSPI' },
    { id: 'cumKOSDAQ', title: '코스닥 누적 순매수', sub: '표시 기간 시작일 기준 누계 · 억원', market: 'KOSDAQ' },
  ];
  grid.innerHTML = specs.map(s =>
    `<section class="card"><h2>${s.title}</h2><p class="sub">${s.sub}</p>
     <div class="legend">${named.map(([, nm, col]) =>
      `<span><i style="background:${col}"></i>${nm}</span>`).join('')}</div>
     <figure data-id="${s.id}"></figure></section>`).join('') +
    `<section class="card wide"><h2>기관 내역별 순매수</h2>
       <p class="sub" id="instsub"></p><figure data-id="inst"></figure></section>`;

  specs.forEach(s => {
    const rows = cumulate(F.market_series[s.market] || [], keys, n);
    chart(grid.querySelector(`figure[data-id="${s.id}"]`), {
      title: s.title, rows, tick: t => nf(t),
      series: named.map(([k, nm, col]) =>
        ({ name: nm, color: col, get: r => r[k], fmt: v => nf(v) + '억' })),
    });
  });

  const w = F.windows[WIN], det = w && w.inst_detail;
  if (det) {
    const items = F.inst_detail
      .map(k => ({ k: F.labels[k], v: det.values[k] || 0 }))
      .sort((a, b) => b.v - a.v);
    document.getElementById('instsub').textContent =
      `코스피 · ${det.from} ~ ${det.to} 합계 (${det.days}거래일) · 억원` +
      (det.stale ? ` — 네이버 구 페이지 종료로 ${det.to} 이후 세부 주체 데이터 없음` : '');
    bars(grid.querySelector('figure[data-id="inst"]'), items, v => nf(v));
  }
}

function rankTable(list, color) {
  if (!list || !list.length) return '<p class="empty">데이터 없음</p>';
  const max = Math.max(...list.map(x => Math.abs(x.amt))) || 1;
  return '<table class="rank"><tbody>' + list.map(x =>
    `<tr><td>${x.name}<span class="mk">${x.market === 'KOSPI' ? '코스피' : '코스닥'}</span></td>
         <td class="num amt">${nf(x.amt, 0)}억</td>
         <td class="bar-cell"><span class="track"><span class="fill"
             style="width:${(Math.abs(x.amt) / max * 100).toFixed(1)}%;background:${color}"></span></span></td>
     </tr>`).join('') + '</tbody></table>';
}

function flowTables() {
  const w = F.windows[WIN];
  const host = document.getElementById('flowtables');
  if (!w || !w.stocks || !w.stocks[WHO]) { host.innerHTML = ''; return; }
  const who = WHO === 'frgn' ? '외국인' : '기관';
  const s = w.stocks[WHO];
  host.innerHTML =
    `<section class="card"><h2>${who} 순매수 상위</h2>
       <p class="sub">${w.stock_from} ~ ${w.stock_to} 누계</p>${rankTable(s.buy, C('--up'))}</section>
     <section class="card"><h2>${who} 순매도 상위</h2>
       <p class="sub">${w.stock_from} ~ ${w.stock_to} 누계</p>${rankTable(s.sell, C('--down'))}</section>`;
  document.getElementById('flownote').innerHTML =
    '종목별 금액은 <b>순매수 수량 × 당일 종가</b>로 계산한 추정치입니다 (실제 체결가 가중 아님). ' +
    '대상은 시가총액 상위 코스피 300 · 코스닥 200 종목이며, 종목 단위로는 외국인 · 기관 · 개인 ' +
    '3주체만 공개됩니다 — 사모 · 연기금 등 세부 주체는 시장 전체 집계에만 있습니다.';
}

function bindSeg(id, apply) {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    [...e.currentTarget.querySelectorAll('button')].forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    apply(b);
  });
}

if (F && F.market_series && (F.market_series.KOSPI || []).length) {
  document.getElementById('flows').hidden = false;
  bindSeg('flowwho', b => { WHO = b.dataset.who; flowTables(); });
  bindSeg('flowwin', b => { WIN = b.dataset.w; flowCharts(N); flowTables(); });
}

/* ── 렌더 ────────────────────────────── */
let N = 250;
function render() {
  const rows = N ? R.slice(-N) : R;
  const grid = document.getElementById('grid');
  grid.innerHTML = cards().map(c =>
    `<section class="card${c.wide ? ' wide' : ''}">
       <h2>${c.title}</h2><p class="sub">${c.sub}</p>
       ${c.series.length > 1 ? '<div class="legend">' + c.series.map(s =>
      `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('') + '</div>' : ''}
       <figure data-id="${c.id}"></figure>
     </section>`).join('');
  cards().forEach(c => chart(grid.querySelector(`figure[data-id="${c.id}"]`),
    { ...c, rows }));
  if (F && F.market_series && (F.market_series.KOSPI || []).length) {
    flowCharts(N); flowTables();
  }
}

document.getElementById('range').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...e.currentTarget.querySelectorAll('button')].forEach(x =>
    x.setAttribute('aria-pressed', String(x === b)));
  N = +b.dataset.n; render();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
heads(); table(); render();
</script>
